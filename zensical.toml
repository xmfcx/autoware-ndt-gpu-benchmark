[project]
site_name = "Autoware NDT GPU Benchmark"
site_description = "Resource use and accuracy of GPU NDT scan matchers in Autoware's localization loop, reproducible."
# Must end with "/".
site_url = "https://xmfcx.github.io/autoware-ndt-gpu-benchmark/"
repo_url = "https://github.com/xmfcx/autoware-ndt-gpu-benchmark"
repo_name = "xmfcx/autoware-ndt-gpu-benchmark"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
copyright = "Copyright &copy; 2026 Mete Fatih Cırıt"

nav = [
  { "Home" = "index.md" },
  { "The options" = "options.md" },
  { "Method" = "method.md" },
  { "Results" = "results.md" },
  { "The ndt_cuda fix" = "ndt-cuda-fix.md" },
  { "Open loop" = "open-loop.md" },
  { "Findings" = "findings.md" },
  { "Code review" = "code-review.md" },
  { "Reproduce" = "reproduce.md" },
  { "Data" = "data.md" },
]

[project.theme]
name = "material"
variant = "modern"
language = "en"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Montserrat"
code = "Roboto Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/weather-sunny", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/weather-night", name = "Switch to light mode" }

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/xmfcx/autoware-ndt-gpu-benchmark"
name = "Source of this benchmark on GitHub"

# The same Markdown extensions as the Autoware documentation, without the ones that need extra packages.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions."pymdownx.details"]
[project.markdown_extensions."pymdownx.highlight"]
pygments_lang_class = true
[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.keys"]
[project.markdown_extensions."pymdownx.mark"]
# The results page includes results/summary.md, which harness/summarize.py writes.
[project.markdown_extensions."pymdownx.snippets"]
base_path = ["."]
check_paths = true
[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.toc]
permalink = "#"
toc_depth = 3
